<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>講座管理｜Udatsu</title><link rel="stylesheet" href="/styles.css"><script type="module" src="/admin.js"></script></head><body><header class="wrap admin-header"><a class="brand" href="/">Udatsu <span class="brand-sub">講座管理</span></a><p>募集枠を登録し、決済済みの参加者と連携状況を確認できます。</p></header><main class="wrap admin-layout"><div><section class="admin-card"><h2>管理者ログイン</h2><form id="login"><label class="form-field">管理トークン<input id="token" type="password" autocomplete="off" required></label><button class="button dark wide">管理画面を開く</button></form><p class="quiet">設定ファイルのADMIN_TOKENを入力。ブラウザには保存しません。</p><button id="logout" class="back-button" hidden>ログアウト</button></section><section class="admin-card" id="slot-editor" hidden><h2>募集枠を追加</h2><form id="slot-form"><label class="form-field">開始日時（日本時間）<input name="start" type="datetime-local" required></label><label class="form-field">終了日時（日本時間）<input name="end" type="datetime-local" required></label><label class="form-field">開催形式<select name="format"><option>オンライン</option><option>対面</option></select></label><label class="form-field">公開する会場・案内<input name="location" maxlength="200" placeholder="例：オンライン（Google Meet）" required></label><label class="form-field">購入者だけに見せる参加URL<input name="meetingUrl" type="url" placeholder="https://meet.google.com/..."></label><p class="quiet">各講座60分です。枠は60分以上で登録してください。間の休憩は、次の枠の開始時刻を空けて確保します。</p><button class="button dark wide">この枠を登録する</button></form></section></div><div><div id="admin-message" role="status" class="admin-message"></div><div id="dashboard" hidden><section class="admin-card"><h2>接続と処理状況</h2><p id="connection"></p><button class="button small" id="retry">決済・連携を再確認</button><div id="jobs"></div></section><section class="admin-card"><h2>登録した募集枠</h2><div id="slots" class="table-scroll"></div></section><section class="admin-card"><h2>お申し込み</h2><p class="quiet">決済済みの方が参加確定です。「手続き中」は参加者として数えません。</p><div id="orders" class="table-scroll"></div></section></div></div></main></body></html>
